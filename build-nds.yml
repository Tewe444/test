name: skydash.nds bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        run: make -C nds
      - name: skydash.nds bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: skydash-nds
          path: nds/skydash.nds
